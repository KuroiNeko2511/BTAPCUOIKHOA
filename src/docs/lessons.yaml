/lessons/{lessonId}:
  get:
    tags: [Lessons]
    summary: Lấy chi tiết bài học
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: lessonId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Chi tiết bài học
      "404":
        description: Không tìm thấy bài học

  patch:
    tags: [Lessons]
    summary: Cập nhật bài học (Admin hoặc mentor của lớp)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: lessonId
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
                nullable: true
              orderIndex:
                type: integer
                minimum: 1
                example: 1
    responses:
      "200":
        description: Cập nhật thành công

  delete:
    tags: [Lessons]
    summary: Xoá bài học (Admin hoặc mentor của lớp)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: lessonId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Xoá thành công

/lessons/{lessonId}/complete:
  post:
    tags: [Lessons]
    summary: Đánh dấu hoàn thành bài học (Member)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: lessonId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Đánh dấu thành công, trả về bản ghi tiến độ
        content:
          application/json:
            example:
              success: true
              message: Lesson completed successfully!
              data:
                id: 1
                lesson_id: 1
                member_id: 4
                completed_at: "2026-11-17T08:30:00.000Z"
      "409":
        description: Bài học đã được đánh dấu hoàn thành

/classes/{classId}/lessons:
  post:
    tags: [Lessons]
    summary: Tạo bài học trong lớp (Admin hoặc mentor của lớp)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title:
                type: string
              content:
                type: string
                nullable: true
              orderIndex:
                type: integer
                minimum: 1
                example: 1
    responses:
      "201":
        description: Tạo bài học thành công
      "403":
        description: Không có quyền quản lý bài học

  get:
    tags: [Lessons]
    summary: Lấy danh sách bài học của lớp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Danh sách bài học
      "404":
        description: Không tìm thấy lớp

/classes/{classId}/progress:
  get:
    tags: [Lessons]
    summary: Lấy tiến độ học cá nhân trong lớp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Tiến độ học
        content:
          application/json:
            example:
              success: true
              message: Class progress retrieved successfully.
              data:
                totalLessons: 3
                completedLessons: 2
                progress: "67%"
      "403":
        description: Không có quyền truy cập
