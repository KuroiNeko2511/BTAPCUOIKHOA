/classes/{classId}/assignments:
  get:
    tags: [Assignments]
    summary: Lấy danh sách bài tập của lớp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Danh sách bài tập

  post:
    tags: [Assignments]
    summary: Tạo bài tập mới (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title:
                type: string
              description:
                type: string
                nullable: true
              maximumScore:
                type: number
                minimum: 0.01
                maximum: 999.99
                example: 10
              deadline:
                type: string
                nullable: true
                format: date-time
    responses:
      "201":
        description: Tạo thành công
        content:
          application/json:
            example:
              success: true
              message: Assignment created successfully.
              data:
                id: 1
                class_id: 1
                title: Xây dựng REST API
                description: null
                deadline: null
                maximum_score: "10.00"
                created_at: "2026-11-17T08:30:00.000Z"
                updated_at: "2026-11-17T08:30:00.000Z"
                is_closed: false

/assignments/{id}:
  get:
    tags: [Assignments]
    summary: Lấy chi tiết bài tập
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Chi tiết bài tập
      "404":
        description: Không tìm thấy

  patch:
    tags: [Assignments]
    summary: Cập nhật bài tập (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
                nullable: true
              maximumScore:
                type: number
                minimum: 0.01
                maximum: 999.99
                example: 10
              deadline:
                type: string
                nullable: true
                format: date-time
    responses:
      "200":
        description: Cập nhật thành công
      "409":
        description: Bài tập đã có bài nộp và điểm tối đa không thể thay đổi

  delete:
    tags: [Assignments]
    summary: Xoá bài tập (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Xoá thành công

/assignments/{assignmentId}/submissions:
  post:
    tags: [Assignments]
    summary: Nộp bài tập (Member)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            anyOf:
              - required: [content]
              - required: [repositoryUrl]
            properties:
              content:
                type: string
                nullable: true
              repositoryUrl:
                type: string
                nullable: true
                format: uri
                example: https://github.com/example/learning-api
    responses:
      "201":
        description: Nộp bài thành công
      "400":
        description: Quá hạn hoặc nội dung nộp không hợp lệ
      "409":
        description: Đã nộp bài rồi

  get:
    tags: [Assignments]
    summary: Lấy danh sách bài nộp của bài tập
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Danh sách bài nộp

/submissions/{id}:
  get:
    tags: [Assignments]
    summary: Lấy chi tiết bài nộp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Chi tiết bài nộp
      "403":
        description: Không có quyền xem bài nộp của người khác

/submissions/{id}/review:
  patch:
    tags: [Assignments]
    summary: Chấm điểm bài nộp (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [score]
            properties:
              score:
                type: number
                minimum: 0
                example: 8.5
              feedback:
                type: string
                nullable: true
    responses:
      "200":
        description: Chấm điểm thành công
