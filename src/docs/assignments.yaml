/classes/{classId}/assignments:
  get:
    tags: [Assignments]
    summary: Lấy danh sách bài tập của lớp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Danh sách bài tập

  post:
    tags: [Assignments]
    summary: Tạo bài tập mới (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            additionalProperties: false
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 200
              description:
                type: string
                maxLength: 10000
                nullable: true
              maximumScore:
                type: number
                minimum: 0.01
                maximum: 999.99
                multipleOf: 0.01
              deadline:
                type: string
                nullable: true
                description: Local Vietnam time in YYYY-MM-DDTHH:mm format; ISO 8601 with timezone is also accepted.
                example: "2026-11-24T19:32"
    responses:
      "201":
        description: Tạo thành công

/assignments/{id}:
  get:
    tags: [Assignments]
    summary: Lấy chi tiết bài tập
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Chi tiết bài tập
      "404":
        description: Không tìm thấy

  patch:
    tags: [Assignments]
    summary: Cập nhật bài tập (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 200
              description:
                type: string
                maxLength: 10000
                nullable: true
              maximumScore:
                type: number
                minimum: 0.01
                maximum: 999.99
                multipleOf: 0.01
              deadline:
                type: string
                nullable: true
                description: Local Vietnam time in YYYY-MM-DDTHH:mm format; ISO 8601 with timezone is also accepted.
                example: "2026-11-24T19:32"
    responses:
      "200":
        description: Cập nhật thành công

  delete:
    tags: [Assignments]
    summary: Xoá bài tập (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Xoá thành công

/assignments/{assignmentId}/submissions:
  post:
    tags: [Assignments]
    summary: Nộp bài tập (Member)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            anyOf:
              - required: [content]
                properties:
                  content:
                    type: string
                    minLength: 1
              - required: [repositoryUrl]
                properties:
                  repositoryUrl:
                    type: string
                    minLength: 1
                    maxLength: 500
                    format: uri
                    pattern: '^https?://'
            properties:
              content:
                type: string
                minLength: 1
                maxLength: 10000
                nullable: true
              repositoryUrl:
                type: string
                minLength: 1
                maxLength: 500
                format: uri
                pattern: '^https?://'
                nullable: true
                example: https://github.com/user/repo
            description: |
              Phải có ít nhất một field không rỗng. Nếu gửi cả hai, từng field
              có thể là null hoặc chuỗi không rỗng; URL phải dùng HTTP hoặc HTTPS.
    responses:
      "201":
        description: Nộp bài thành công
      "409":
        description: Đã nộp bài rồi

  get:
    tags: [Assignments]
    summary: Lấy danh sách bài nộp của bài tập
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Danh sách bài nộp

/submissions/{id}:
  get:
    tags: [Assignments]
    summary: Lấy chi tiết bài nộp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Chi tiết bài nộp
      "403":
        description: Không có quyền xem bài nộp của người khác

/submissions/{id}/review:
  patch:
    tags: [Assignments]
    summary: Chấm điểm bài nộp (Mentor)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [score]
            minProperties: 1
            additionalProperties: false
            properties:
              score:
                type: number
                minimum: 0
                multipleOf: 0.01
                description: Phải không lớn hơn maximumScore của bài tập.
              feedback:
                type: string
                maxLength: 10000
                nullable: true
    responses:
      "200":
        description: Chấm điểm thành công
