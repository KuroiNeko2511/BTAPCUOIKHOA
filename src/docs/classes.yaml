/classes:
  get:
    tags: [Classes]
    summary: Lấy danh sách lớp học (theo role)
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Danh sách lớp học

  post:
    tags: [Classes]
    summary: Tạo lớp học mới (Admin)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, mentorId]
            properties:
              name:
                type: string
                minLength: 2
                maxLength: 150
                example: Lớp NodeJS 01
              description:
                type: string
                nullable: true
              mentorId:
                type: integer
                example: 2
              startDate:
                type: string
                format: date
                nullable: true
              endDate:
                type: string
                format: date
                nullable: true
    responses:
      "201":
        description: Tạo lớp thành công

/classes/{id}:
  get:
    tags: [Classes]
    summary: Lấy chi tiết lớp học
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Chi tiết lớp học
      "404":
        description: Không tìm thấy lớp

  patch:
    tags: [Classes]
    summary: Cập nhật lớp học (Admin)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 2
                maxLength: 150
              description:
                type: string
                nullable: true
              mentorId:
                type: integer
              startDate:
                type: string
                format: date
                nullable: true
              endDate:
                type: string
                format: date
                nullable: true
              status:
                type: string
                enum: [UPCOMING, ONGOING, COMPLETED]
    responses:
      "200":
        description: Cập nhật thành công

  delete:
    tags: [Classes]
    summary: Xoá lớp học (Admin)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Xoá thành công

/classes/{id}/members:
  get:
    tags: [Classes]
    summary: Lấy danh sách thành viên lớp
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Danh sách thành viên

  post:
    tags: [Classes]
    summary: Thêm thành viên vào lớp (Admin)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [memberId]
            properties:
              memberId:
                type: integer
    responses:
      "201":
        description: Thêm thành công

/classes/{id}/members/{memberId}:
  delete:
    tags: [Classes]
    summary: Xoá thành viên khỏi lớp (Admin)
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: memberId
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Xoá thành công

